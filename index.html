<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cuotas</title>

  <!-- PWA / iOS -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#eef2f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cuotas">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Pantalla: Resumen -->
  <section class="screen is-active" data-screen="resumen">
    <header class="app-header">
      <div class="hello">
        <img src="icons/logo.png" alt="Logo" class="logo-avatar">
        <div>
          <div class="hello-top">Hola 👋</div>
          <h1 class="hello-title">Tus cuotas</h1>
        </div>
      </div>
      <button id="btnAddHeader" class="add-chip" aria-label="Añadir gasto">
        <span class="plus">+</span>
      </button>
    </header>

    <main class="content">
      <!-- Saldo disponible -->
      <section class="card saldo-card">
        <div class="saldo-label">Saldo disponible este mes</div>
        <div class="saldo-value" id="saldoValue">--.- €</div>
        <div class="saldo-sub" id="saldoSub">...</div>

        <div class="saldo-row">
          <div class="saldo-item">
            <div class="saldo-item-label">Presupuesto</div>
            <div class="saldo-item-val" id="presupuestoVal">--</div>
          </div>
          <div class="saldo-item">
            <div class="saldo-item-label">Cuotas del mes</div>
            <div class="saldo-item-val" id="cuotasMesVal">--</div>
          </div>
        </div>

        <button id="btnEditPresupuesto" class="ghost-btn">Ajustar presupuesto</button>
      </section>

      <!-- Próximos cargos -->
      <section class="block">
        <h2 class="block-title">Próximos cargos</h2>
        <div class="next-month-scroll" id="nextMonths">
          <!-- rellenado por JS -->
        </div>
      </section>

      <!-- Progreso de gastos -->
      <section class="block">
        <h2 class="block-title">Mis compras a plazos</h2>
        <div id="gastosList" class="gastos-list">
          <!-- rellenado por JS -->
        </div>
      </section>
    </main>
  </section>

  <!-- Pantalla: Gastos (lista completa) -->
  <section class="screen" data-screen="gastos">
    <header class="app-header">
      <div class="hello">
        <div class="hello-top">Todo</div>
        <h1 class="home-title">Gastos</h1>
      </div>
      <button class="add-chip" data-go="add" aria-label="Añadir gasto">
        <span class="plus">+</span>
      </button>
    </header>
    <main class="content">
      <div class="gastos-list" id="gastosListFull"></div>
    </main>
  </section>

  <!-- Pantalla: Añadir / Editar -->
  <section class="screen" data-screen="add">
    <header class="app-header form-header">
      <button class="back-btn" data-go="resumen" id="btnBack">‹</button>
      <h1 class="form-title" id="formTitle">Nuevo gasto</h1>
      <span class="header-spacer"></span>
    </header>
    <main class="content form">
      <input type="hidden" id="fId">

      <label class="field">
        <span class="field-label">Nombre</span>
        <input id="fNombre" type="text" placeholder="Ej. PlayStation 5">
      </label>

      <label class="field">
        <span class="field-label">Precio total (€)</span>
        <input id="fPrecio" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0,00">
      </label>

      <label class="field">
        <span class="field-label">Cuota mensual (€)</span>
        <input id="fCuota" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0,00">
      </label>

      <label class="field">
        <span class="field-label">Cuotas totales</span>
        <input id="fCuotasTotales" type="number" inputmode="numeric" min="1" step="1" placeholder="12">
      </label>

      <label class="field">
        <span class="field-label">Primera cuota (fecha)</span>
        <input id="fFecha" type="date">
      </label>

      <label class="field">
        <span class="field-label">Cuotas ya pagadas</span>
        <input id="fPagadas" type="number" inputmode="numeric" min="0" step="1" placeholder="0">
      </label>

      <div class="field-actions">
        <button id="fDelete" class="delete-btn is-hidden">Eliminar gasto</button>
      </div>

      <button id="fSave" class="primary-btn">Guardar</button>
    </main>
  </section>

  <!-- Barra de pestañas -->
  <nav class="tabbar">
    <button class="tab is-active" data-tab="resumen">
      <svg viewBox="0 0 24 24" class="tab-icon"><path d="M3 13h2v8H3zM7 9h2v12H7zM11 4h2v17h-2zM15 8h2v13h-2zM19 11h2v10h-2z" fill="currentColor"/></svg>
      <span class="tab-label">Resumen</span>
    </button>
    <button class="tab" data-tab="gastos">
      <svg viewBox="0 0 24 24" class="tab-icon"><path d="M3 3h18v18H3zM5 5v14h14V5zM7 9l2 2 3-3 4 4v2h2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span class="tab-label">Gastos</span>
    </button>
    <button class="tab tab-add" data-tab="add">
      <svg viewBox="0 0 24 24" class="tab-icon"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span class="tab-label">Añadir</span>
    </button>
  </nav>

  <!-- Hoja de ajuste de presupuesto -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden>
    <div class="sheet">
      <div class="sheet-grabber"></div>
      <h3 class="sheet-title">Presupuesto mensual</h3>
      <label class="field">
        <span class="field-label">¿Cuánto recibes o presupuestas al mes?</span>
        <input id="fPresupuesto" type="number" inputmode="decimal" min="0" step="0.01">
      </label>
      <button id="btnSavePresupuesto" class="primary-btn">Guardar</button>
    </div>
  </div>

  <!-- Hoja de confirmación -->
  <div class="sheet-backdrop" id="confirmBackdrop" hidden>
    <div class="sheet">
      <div class="sheet-grabber"></div>
      <h3 class="sheet-title" id="confirmTitle">¿Eliminar gasto?</h3>
      <p class="sheet-msg" id="confirmMsg">Esta acción no se puede deshacer.</p>
      <button id="btnConfirmCancel" class="secondary-btn">Cancelar</button>
      <button id="btnConfirmOk" class="primary-btn danger">Eliminar</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
